wipop_configuration:
  path: /wipop/configuration
  methods: [GET, POST]
  defaults:
    _controller: PrestaShop\Module\Wipop\Controller\Admin\WipopConfigurationController::configurationAction

wipop_verify_credentials:
  path: /wipop/verify-credentials
  methods: [POST]
  defaults:
    _controller: PrestaShop\Module\Wipop\Controller\Admin\WipopConfigurationController::verifyCredentialsAction
    _legacy_controller: AdminModules

wipop_webhook_regenerate:
  path: /wipop/webhook/regenerate
  methods: [POST]
  defaults:
    _controller: PrestaShop\Module\Wipop\Controller\Admin\WipopConfigurationController::regenerateWebhookCredentialsAction

wipop_order_refund:
  path: /wipop/orders/{orderId}/refund
  methods: [GET, POST]
  defaults:
    _controller: PrestaShop\Module\Wipop\Controller\Admin\WipopOrderRefundController::refundAction
    _legacy_controller: AdminOrders
  requirements:
    orderId: \d+
