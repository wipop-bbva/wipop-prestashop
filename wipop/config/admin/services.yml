services:
  _defaults:
    public: true

  PrestaShop\Module\Wipop\Configuration\SettingsRepository: ~

  PrestaShop\Module\Wipop\Webhook\WebhookSettingsRepository: ~

  PrestaShop\Module\Wipop\Log\Logger: ~

  PrestaShop\Module\Wipop\Api\ClientFactory: ~

  PrestaShop\Module\Wipop\Api\SdkCaller:
    class: PrestaShop\Module\Wipop\Api\SdkCaller
    arguments:
      $logger: '@PrestaShop\Module\Wipop\Log\Logger'

  PrestaShop\Module\Wipop\Api\MerchantOperationsService:
    class: PrestaShop\Module\Wipop\Api\MerchantOperationsService
    arguments:
      $settingsRepository: '@PrestaShop\Module\Wipop\Configuration\SettingsRepository'
      $clientFactory: '@PrestaShop\Module\Wipop\Api\ClientFactory'
      $sdkCaller: '@PrestaShop\Module\Wipop\Api\SdkCaller'

  PrestaShop\Module\Wipop\Webhook\WebhookAuth:
    class: PrestaShop\Module\Wipop\Webhook\WebhookAuth
    arguments:
      $settingsRepository: '@PrestaShop\Module\Wipop\Webhook\WebhookSettingsRepository'
      $logger: '@PrestaShop\Module\Wipop\Log\Logger'

  PrestaShop\Module\Wipop\Controller\Admin\WipopConfigurationController:
    class: PrestaShop\Module\Wipop\Controller\Admin\WipopConfigurationController
    arguments:
      $settingsRepository: '@PrestaShop\Module\Wipop\Configuration\SettingsRepository'
      $merchantOperationsService: '@PrestaShop\Module\Wipop\Api\MerchantOperationsService'
      $webhookAuth: '@PrestaShop\Module\Wipop\Webhook\WebhookAuth'

  PrestaShop\Module\Wipop\Form\Type\SettingsType:
    class: PrestaShop\Module\Wipop\Form\Type\SettingsType
    parent: 'form.type.translatable.aware'
    public: true
    tags:
      - { name: form.type }
