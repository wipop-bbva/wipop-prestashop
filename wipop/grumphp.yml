grumphp:
  git_hook_variables:
    ENV:
      GRUMPHP_BIN_DIR: vendor-dev/bin
  environment:
    variables:
      GRUMPHP_BIN_DIR: vendor-dev/bin
  process_timeout: 600
  tasks:
    phpcsfixer:
      config: .php-cs-fixer.dist.php
      allow_risky: true
      using_cache: true
      triggered_by: [php]
    phpcs:
      standard: phpcs.xml
      triggered_by: [php]
