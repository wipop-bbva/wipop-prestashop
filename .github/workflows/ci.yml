name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Smoke (PHP syntax)
    runs-on: ubuntu-latest
    env:
      CI: true
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Cache Composer + QA tooling
        uses: actions/cache@v4
        with:
          path: |
            .composer-cache
            wipop/vendor
          key: ${{ runner.os }}-php8.1-tools-${{ hashFiles('wipop/composer.lock', 'wipop/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-tools-
            ${{ runner.os }}-php8.1-

      - name: Install dependencies (Composer)
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: wipop

      - name: PHP lint
        run: composer lint:php
        working-directory: wipop

  security:
    name: Composer Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    env:
      CI: true
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.composer-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: composer

      - name: Cache Composer + QA tooling
        uses: actions/cache@v4
        with:
          path: |
            .composer-cache
            wipop/vendor
          key: ${{ runner.os }}-php8.1-tools-${{ hashFiles('wipop/composer.lock', 'wipop/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php8.1-tools-
            ${{ runner.os }}-php8.1-

      - name: Install dependencies (Composer)
        run: composer install --no-interaction --no-progress --prefer-dist
        working-directory: wipop

      - name: Audit composer.lock (all deps)
        run: composer audit --locked
        working-directory: wipop

      - name: Audit composer.lock (prod deps)
        run: composer audit --locked --no-dev
        working-directory: wipop
